name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TASK-81 (KURA_BACKLOG_FIX_7), rodada de fix 1 — G2 apontou que a metade 2
      # de tests/smoke-coverage.test.ts (checar que todo "coberto: <nome>" do
      # registry existe de fato em DevOps-Cloud/scripts/smoke-contratos.sh) só
      # rodava quando os 2 repos eram irmãos no filesystem, o que não é verdade no
      # checkout de CI padrão (só este repo). DevOps-Cloud é público
      # (KURA-Clyvo/DevOps-Cloud) — este segundo checkout lê o HEAD real do script
      # a cada run, sem vendorizar cópia (que criaria fonte dupla e apodreceria,
      # exatamente o padrão que este projeto já reprovou em outro lugar). Fica em
      # $GITHUB_WORKSPACE/DevOps-Cloud — smoke-coverage.test.ts já sabe achar esse
      # caminho (3º candidato de `candidatosDevOpsCloud`).
      - name: Checkout DevOps-Cloud (fonte real do smoke-contratos.sh)
        uses: actions/checkout@v4
        with:
          repository: KURA-Clyvo/DevOps-Cloud
          path: DevOps-Cloud

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --watchAll=false garante saída não-interativa mesmo se o script "test"
      # for alterado para rodar em watch mode por padrão (como já é o caso em
      # mobile-tutor-rn) — ficaria pendurado indefinidamente no CI sem isso.
      - name: Test
        run: npm test -- --watchAll=false

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # CQ-02: prova que a plataforma web é buildável de verdade, não só
      # declarada. "Plataforma que ninguém buildou não é suportada, é
      # aspiracional" — regra de ouro v9 do ciclo. Sem este passo, o suporte
      # web pode voltar a apodrecer em silêncio (react-native-web removido,
      # código de módulo passando a acessar `window` etc.) sem que nenhum
      # gate perceba.
      - name: Web export (prova de build da plataforma web)
        run: npx expo export --platform web

      # CQ-16 — Camada A do detector automatizado (não roda outro export;
      # inspeciona a saída do passo acima, em "dist/", o default do
      # `expo export`). Falha se algum bundle web contiver `import.meta`
      # fora de módulo (quebra o parse no browser real, tela em branco) E
      # falha também se nenhum bundle for encontrado — um `grep` que só
      # roda quando há match "passaria" em silêncio se o export tivesse
      # falhado ou mudado de layout, que é exatamente a classe de falso
      # negativo que este ciclo persegue. Ver
      # scripts/check-web-bundle-import-meta.sh para o raciocínio completo
      # e tests/babel-web-import-meta.test.ts para a Camada B (roda em todo
      # `npm test`, mais rápida, mas cega a mudanças no layout de saída do
      # Expo CLI — as duas camadas são complementares, não substitutas).
      - name: Web bundle não deve conter import.meta (CQ-16)
        run: bash scripts/check-web-bundle-import-meta.sh dist
